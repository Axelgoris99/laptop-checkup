name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun tauri build --bundles nsis
      # The bare .exe runs from a USB stick (Windows 11 ships WebView2).
      - uses: actions/upload-artifact@v4
        with:
          name: laptop-checkup-windows
          path: |
            src-tauri/target/release/laptop-checkup.exe
            src-tauri/target/release/bundle/nsis/*.exe
      # On a v* tag, attach both .exe files to a GitHub Release.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/laptop-checkup.exe
            src-tauri/target/release/bundle/nsis/*.exe
